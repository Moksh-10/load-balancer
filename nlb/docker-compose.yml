services:
  front:
    build: .
    container_name: nlb
    ports:
      - "3030:3030"
    command: ["--backend", "web1:80,web2:80,web3:80", "--port", "3030"]
    depends_on:
      - web1
      - web2
      - web3
  web1:
    image: strm/helloworld-http
  web2:
    image: strm/helloworld-http
  web3:
    image: strm/helloworld-http
